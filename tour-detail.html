<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta id="meta-desc" name="description" content="Détails d'une excursion en Serbie : programme, tarifs et photos. Réservation — Sacha Tour Serbie.">
  <meta name="robots" content="index, follow">
  <meta name="theme-color" content="#002395">
  <link id="seo-canonical" rel="canonical" href="https://sachatourserbie.com/tours.html">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Sacha Tour Serbie">
  <meta id="og-title" property="og:title" content="Sacha Tour Serbie — Détails du tour">
  <meta id="og-desc" property="og:description" content="Détails d'une excursion en Serbie — Sacha Tour Serbie.">
  <meta id="og-url" property="og:url" content="https://sachatourserbie.com/tour-detail.html">
  <meta id="og-image" property="og:image" content="https://sachatourserbie.com/images/tours/belgrade/1.webp">
  <meta property="og:locale" content="fr_FR">
  <meta name="twitter:card" content="summary_large_image">
  <meta id="tw-title" name="twitter:title" content="Sacha Tour Serbie — Détails du tour">
  <meta id="tw-desc" name="twitter:description" content="Détails d'une excursion en Serbie — Sacha Tour Serbie.">
  <meta id="tw-image" name="twitter:image" content="https://sachatourserbie.com/images/tours/belgrade/1.webp">
  <title>Sacha Tour Serbie — Détails du tour</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a href="index.html" class="site-logo" data-i18n="meta.siteName">Sacha Tours</a>
      <button type="button" class="nav-menu-toggle" id="nav-menu-toggle" aria-expanded="false" aria-controls="site-nav-panel" aria-label="Menu">
        <span class="nav-menu-bar" aria-hidden="true"></span>
      </button>
      <div class="header-nav-cluster" id="site-nav-panel">
        <nav class="nav-main">
          <a href="index.html" data-i18n="nav.home">Accueil</a>
          <a href="tours.html" class="active" data-i18n="nav.tours">Tours</a>
          <a href="household.html" data-i18n="nav.household">Maison</a>
          <a href="contact.html" data-i18n="nav.contact">Contact</a>
        </nav>
        <div class="lang-switcher">
          <button type="button" data-lang="sr">SR</button>
          <button type="button" data-lang="it">IT</button>
          <button type="button" data-lang="fr">FR</button>
        </div>
      </div>
    </div>
    <div class="nav-backdrop" id="nav-backdrop" aria-hidden="true"></div>
  </header>

  <main>
    <a href="tours.html" class="back-link">← <span data-i18n="nav.tours">Tours</span></a>
    <div class="tour-detail-header" id="tour-header">
      <h1 id="tour-title">—</h1>
      <p class="price-tag" id="tour-price-tag">—</p>
    </div>
    <div class="tour-detail-content">
      <div>
        <div class="tour-detail-details">
          <h2 data-i18n="tours.detailsTitle">Détails du tour</h2>
          <p id="tour-details">—</p>
        </div>
        <h3 class="tour-gallery-title" style="margin-top:1rem; color: var(--france-blue);" data-i18n="landing.gallery.sectionTitle">Galerie</h3>
        <div class="tour-gallery" id="tour-gallery"></div>
      </div>
      <aside class="tour-detail-sidebar">
        <div class="price-box" id="tour-price-box">—</div>
        <p class="tour-booking-line"><a href="contact.html" class="contact-cta" data-i18n="nav.contact">Contact</a> <span data-i18n="tours.bookingSuffix">pour réserver ce tour.</span></p>
      </aside>
    </div>
  </main>

  <div class="lightbox" id="lightbox" aria-hidden="true">
    <button type="button" class="lightbox-close" id="lightbox-close" aria-label="Fermer">×</button>
    <img id="lightbox-img" src="" alt="">
  </div>

  <footer class="site-footer">
    <p><a href="index.html" data-i18n="meta.siteName">Sacha Tours</a> — <a href="contact.html" data-i18n="nav.contact">Contact</a></p>
  </footer>

  <script src="js/main.js"></script>
  <script>
    (function () {
      function escapeHtml(s) { var d = document.createElement('div'); d.textContent = s == null ? '' : s; return d.innerHTML; }
      function assetUrl(path) {
        if (!path || /^https?:\/\//i.test(path)) return path || '';
        try { return new URL(path, window.location.href).href; } catch (e) { return path; }
      }
      function getTourId() {
        var m = /[?&]id=([^&]+)/.exec(location.search);
        return m ? decodeURIComponent(m[1]) : null;
      }
      function renderTourDetail() {
        var c = window.Sacha && window.Sacha.content();
        if (!c || !c.tours || !c.tours.items) return;
        var lang = window.Sacha.lang();
        var lbCloseBtn = document.getElementById('lightbox-close');
        if (lbCloseBtn && c.tours.lightboxClose) {
          lbCloseBtn.setAttribute('aria-label', c.tours.lightboxClose[lang] || c.tours.lightboxClose.fr || 'Close');
        }
        var id = getTourId();
        var tour = c.tours.items.filter(function (t) { return t.id === id; })[0];
        var base = 'https://sachatourserbie.com';
        function setSeo(opts) {
          var d = document.getElementById('meta-desc');
          var can = document.getElementById('seo-canonical');
          var ogt = document.getElementById('og-title');
          var ogd = document.getElementById('og-desc');
          var ogu = document.getElementById('og-url');
          var ogi = document.getElementById('og-image');
          var twt = document.getElementById('tw-title');
          var twd = document.getElementById('tw-desc');
          var twi = document.getElementById('tw-image');
          if (opts.title) document.title = opts.title;
          if (d && opts.description != null) d.setAttribute('content', opts.description);
          if (can && opts.canonical) can.setAttribute('href', opts.canonical);
          if (ogt && opts.ogTitle != null) ogt.setAttribute('content', opts.ogTitle);
          if (ogd && opts.ogDescription != null) ogd.setAttribute('content', opts.ogDescription);
          if (ogu && opts.ogUrl) ogu.setAttribute('content', opts.ogUrl);
          if (ogi && opts.ogImage) ogi.setAttribute('content', opts.ogImage);
          if (twt && opts.ogTitle != null) twt.setAttribute('content', opts.ogTitle);
          if (twd && opts.ogDescription != null) twd.setAttribute('content', opts.ogDescription);
          if (twi && opts.ogImage) twi.setAttribute('content', opts.ogImage);
        }
        if (!tour) {
          var nf = c.tours.tourNotFound;
          document.getElementById('tour-title').textContent = (nf && (nf[lang] || nf.fr)) || '—';
          setSeo({
            title: ((nf && (nf[lang] || nf.fr)) || 'Tour') + ' — Sacha Tour Serbie',
            description: 'Sacha Tour Serbie — excursions guidées en Serbie.',
            canonical: base + '/tours.html',
            ogTitle: 'Sacha Tour Serbie',
            ogDescription: 'Excursions en Serbie — Sacha Tour Serbie.',
            ogUrl: base + '/tours.html',
            ogImage: base + '/images/tours/belgrade/1.webp',
          });
          return;
        }
        var t = tour[lang] || tour.fr;
        var priceFrom = (c.tours.priceFrom && (c.tours.priceFrom[lang] || c.tours.priceFrom.fr)) || '';
        var perPerson = (c.tours.perPerson && (c.tours.perPerson[lang] || c.tours.perPerson.fr)) || '';
        var priceStr = priceFrom + ' ' + (t.price != null ? t.price : '') + ' € ' + perPerson;
        document.getElementById('tour-title').textContent = t.title || '';
        document.getElementById('tour-price-tag').textContent = priceStr;
        document.getElementById('tour-details').textContent = t.details || '';
        document.getElementById('tour-price-box').textContent = (t.price != null ? t.price : '') + ' € ' + perPerson;
        var gallery = document.getElementById('tour-gallery');
        var imgs = tour.images || [];
        gallery.innerHTML = imgs.map(function (src, i) {
          var u = assetUrl(src);
          return '<img src="' + escapeHtml(u) + '" alt="' + escapeHtml(t.title) + ' ' + (i + 1) + '" loading="lazy" data-lightbox>';
        }).join('');
        var lb = document.getElementById('lightbox');
        var lbImg = document.getElementById('lightbox-img');
        var lbClose = document.getElementById('lightbox-close');
        gallery.querySelectorAll('[data-lightbox]').forEach(function (img) {
          img.addEventListener('click', function () {
            lbImg.src = img.src;
            lbImg.alt = img.alt;
            lb.classList.add('active');
            lb.setAttribute('aria-hidden', 'false');
          });
        });
        function closeLb() { lb.classList.remove('active'); lb.setAttribute('aria-hidden', 'true'); }
        if (lbClose) lbClose.addEventListener('click', closeLb);
        lb.addEventListener('click', function (e) { if (e.target === lb) closeLb(); });

        var pageUrl = base + '/tour-detail.html?id=' + encodeURIComponent(id);
        var desc = (t.title || '') + ' — ' + (t.shortDesc || '');
        var firstImg = imgs.length ? assetUrl(imgs[0]) : base + '/images/tours/belgrade/1.webp';
        setSeo({
          title: (t.title || '') + ' — Sacha Tour Serbie',
          description: desc,
          canonical: pageUrl,
          ogTitle: (t.title || '') + ' — Sacha Tour Serbie',
          ogDescription: t.shortDesc || desc,
          ogUrl: pageUrl,
          ogImage: firstImg,
        });
      }
      window.renderPageContent = renderTourDetail;
      if (window.Sacha && window.Sacha.content()) renderTourDetail();
    })();
  </script>
</body>
</html>
