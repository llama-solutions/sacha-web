<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sacha Tours — Tours</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a href="index.html" class="site-logo" data-i18n="meta.siteName">Sacha Tours</a>
      <nav class="nav-main">
        <a href="index.html" data-i18n="nav.home">Accueil</a>
        <a href="tours.html" class="active" data-i18n="nav.tours">Tours</a>
        <a href="household.html" data-i18n="nav.household">Maison</a>
        <a href="contact.html" data-i18n="nav.contact">Contact</a>
      </nav>
      <div class="lang-switcher">
        <button type="button" data-lang="sr">SR</button>
        <button type="button" data-lang="it">IT</button>
        <button type="button" data-lang="fr">FR</button>
      </div>
    </div>
  </header>

  <main>
    <div class="tours-intro">
      <h1 data-i18n="tours.pageTitle">Nos tours</h1>
      <p data-i18n="tours.pageSubtitle">Choisissez le voyage sur mesure</p>
    </div>
    <div class="tours-grid" id="tours-grid"></div>
  </main>

  <footer class="site-footer">
    <p><a href="index.html" data-i18n="meta.siteName">Sacha Tours</a> — <a href="contact.html" data-i18n="nav.contact">Contact</a></p>
  </footer>

  <script src="js/main.js"></script>
  <script>
    (function () {
      function escapeHtml(s) { var d = document.createElement('div'); d.textContent = s == null ? '' : s; return d.innerHTML; }
      function renderTours() {
        var c = window.Sacha && window.Sacha.content();
        if (!c || !c.tours || !c.tours.items) return;
        var lang = window.Sacha.lang();
        var priceFrom = c.tours.priceFrom && (c.tours.priceFrom[lang] || c.tours.priceFrom.fr) || '';
        var perPerson = c.tours.perPerson && (c.tours.perPerson[lang] || c.tours.perPerson.fr) || '';
        var grid = document.getElementById('tours-grid');
        if (!grid) return;
        grid.innerHTML = c.tours.items.map(function (tour) {
          var t = tour[lang] || tour.fr;
          var title = t.title || '';
          var shortDesc = t.shortDesc || '';
          var price = t.price != null ? t.price : '';
          var img = (tour.images && tour.images[0]) || '';
          var imgSrc = img;
          if (img && !/^https?:\/\//i.test(img)) {
            try { imgSrc = new URL(img, window.location.href).href; } catch (e) {}
          }
          return '<a class="tour-card" href="tour-detail.html?id=' + encodeURIComponent(tour.id) + '">' +
            '<img class="tour-card-image" src="' + escapeHtml(imgSrc) + '" alt="' + escapeHtml(title) + '" loading="lazy" onerror="this.onerror=null;this.style.background=\'linear-gradient(135deg,#002395,#ed2939)\';this.style.minHeight=\'150px\'">' +
            '<div class="tour-card-body">' +
              '<h3>' + escapeHtml(title) + '</h3>' +
              '<p class="short-desc">' + escapeHtml(shortDesc) + '</p>' +
              '<p class="price">' + escapeHtml(priceFrom) + ' ' + escapeHtml(price) + ' € ' + escapeHtml(perPerson) + '</p>' +
            '</div></a>';
        }).join('');
      }
      window.renderPageContent = renderTours;
      if (window.Sacha && window.Sacha.content()) renderTours();
    })();
  </script>
</body>
</html>
